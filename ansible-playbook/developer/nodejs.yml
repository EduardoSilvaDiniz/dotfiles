- name: Instalar Node.js e pnpm
  hosts: localhost
  become: yes

  tasks:
    - name: Instalar Node.js e pnpm no Fedora
      ansible.builtin.package:
        name:
          - nodejs
          - npm
        state: present
        install_weak_deps: false
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Instalar Node.js e pnpm no Debian
      ansible.builtin.package:
        name:
          - nodejs
          - npm
        state: present
      when: ansible_facts['os_family'] == 'Debian'
