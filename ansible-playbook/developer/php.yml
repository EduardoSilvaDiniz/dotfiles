- name: instala conjunto de ferramentas para PHP e framework Laravel
  hosts: localhost
  become: yes

  tasks:
    - name: Obter valor de $USER
      set_fact:
        user_home: "{{ lookup('env', 'HOME') }}"

    - name: Instalar PHP e ferramentas no Fedora
      ansible.builtin.package:
        name:
          - php-cli
          - phpunit
          - php-pdo
          - php-sqlite3
          - php-pgsql
          - php-mysqlnd
          - composer
        state: present
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Instalar PHP e ferramentas no Debian
      ansible.builtin.package:
        name:
          - php-cli
          - phpunit
          - php-common
          - php-sqlite3
          - php-pgsql
          - php-mysql
          - composer
        state: present
      when: ansible_facts['os_family'] == 'Debian'

    - name: Instala Laravel
      ansible.builtin.shell: composer global require "laravel/installer" -n
      become: false

    - name: Adicionando PATH .config/composer/vendor/bin para fish
      ansible.builtin.shell: set -Ux fish_user_paths $fish_user_paths $HOME/.config/composer/vendor/bin
      when:
        - ansible_facts['env']['SHELL'] is defined
        - "'fish' in ansible_facts['env']['SHELL']"
      register: fish_path_result
      changed_when: fish_path_result.rc == 0

    - name: Exibe aviso se o PATH foi alterado
      ansible.builtin.debug:
        msg: "O PATH global do fish foi atualizado. O usuário deve reabrir o terminal ou executar 'exec fish' para que a mudança entre em vigor."
      when: fish_path_result is changed
