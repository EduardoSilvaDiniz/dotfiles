services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: mssql2025

    volumes:
    # Exemplo de atribuição de volumes
      #- ./datasets:/datasets
      #- ./scripts:/scripts
      - type: tmpfs
        target: /dev/shm
        tmpfs:
          size: 134217728 # 128*2^20 bytes = 128Mb
    # Exemplo de execução de script startup
    #command: sh -c ' chmod +x /scripts/entrypoint.sh; ./scripts/entrypoint.sh & /opt/mssql/bin/sqlservr;'
    ports:
        - 1433:1433
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=SENHA
      - MSSQL_PID=Express
